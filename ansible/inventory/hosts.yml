---
all:
  vars:  # 모든 호스트에 적용될 변수를 여기로 이동
    # Kubernetes 클러스터 설정
    cluster_name: "owncloud-k8s"
    pod_network_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"
    k8s_version: "1.28.0"  
    
    # Container Runtime
    container_runtime: containerd
    
    # CNI Plugin
    cni_plugin: calico
    calico_version: "3.26.1"  
    
    # API Server 설정
    api_server_advertise_address: "192.168.100.20"  # 마스터 IP
    control_plane_endpoint: "192.168.100.20"  # 마스터 IP
    
  children:
    masters:
      hosts:
        k8s-master:
          ansible_host: 192.168.100.20
          ansible_user: root
          ansible_ssh_pass: "owncloud123!"
          node_role: master
    workers:
      hosts:
        k8s-worker1:
          ansible_host: 192.168.100.30
          ansible_user: root
          ansible_ssh_pass: "owncloud123!"
          node_role: worker
        k8s-worker2:
          ansible_host: 192.168.100.31
          ansible_user: root
          ansible_ssh_pass: "owncloud123!"
          node_role: worker