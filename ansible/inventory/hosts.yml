---
all:
  children:
    masters:
      hosts:
        k8s-master:
          ansible_host: 192.168.56.30
          ansible_user: root
          ansible_ssh_pass: "owncloud123!"
          node_role: master
    workers:
      hosts:
        k8s-worker1:
          ansible_host: 192.168.56.31
          ansible_user: root
          ansible_ssh_pass: "owncloud123!"
          node_role: worker
        k8s-worker2:
          ansible_host: 192.168.56.32
          ansible_user: root
          ansible_ssh_pass: "owncloud123!"
          node_role: worker
    kubernetes:
      children:
        - masters
        - workers
      vars:
        # Kubernetes 클러스터 설정
        cluster_name: "owncloud-k8s"
        pod_network_cidr: "10.244.0.0/16"
        service_cidr: "10.96.0.0/12"
        kubernetes_version: "1.28"
        
        # Container Runtime
        container_runtime: containerd
        
        # CNI Plugin
        cni_plugin: calico
        
        # API Server 설정
        api_server_advertise_address: "192.168.56.30"
        control_plane_endpoint: "k8s-master:6443"