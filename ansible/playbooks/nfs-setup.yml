---
- name: NFS 서버 구성
  hosts: masters  # 또는 별도의 NFS 서버 호스트
  become: true
  vars:
    nfs_export_dir: "/nfs-share"
    nfs_subnet: "192.168.100.0/24"
    
  tasks:
    # NFS 패키지 설치
    - name: NFS 관련 패키지 설치
      dnf:
        name:
          - nfs-utils
          - rpcbind
        state: present

    # NFS 공유 디렉토리 생성
    - name: NFS 공유 디렉토리 생성
      file:
        path: "{{ nfs_export_dir }}"
        state: directory
        mode: '0777'
        owner: nobody
        group: nobody

    - name: 하위 디렉토리 생성 (PV용)
      file:
        path: "{{ nfs_export_dir }}/{{ item }}"
        state: directory
        mode: '0777'
        owner: nobody
        group: nobody
      loop:
        - pv001
        - pv002
        - pv003
        - pv004
        - pv005

    # NFS exports 설정
    - name: NFS exports 파일 설정
      lineinfile:
        path: /etc/exports
        line: "{{ nfs_export_dir }} {{ nfs_subnet }}(rw,sync,no_subtree_check,no_root_squash,no_all_squash)"
        create: yes
      notify: restart nfs

    # 서비스 활성화 및 시작
    - name: NFS 관련 서비스 활성화 및 시작
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - rpcbind
        - nfs-server

    # 방화벽 설정 (필요시)
    - name: 방화벽에서 NFS 허용 (firewalld가 활성화된 경우)
      firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - nfs
        - mountd
        - rpc-bind
      ignore_errors: yes  # 방화벽이 비활성화된 경우 무시

    # NFS exports 적용
    - name: NFS exports 재적용
      command: exportfs -ra
      changed_when: false

  handlers:
    - name: restart nfs
      systemd:
        name: nfs-server
        state: restarted

# NFS 클라이언트 설정 (워커 노드)
- name: NFS 클라이언트 구성
  hosts: workers
  become: true
  
  tasks:
    - name: NFS 클라이언트 패키지 설치
      dnf:
        name: nfs-utils
        state: present

    - name: NFS 마운트 테스트를 위한 디렉토리 생성
      file:
        path: /mnt/nfs-test
        state: directory
        mode: '0755'

# NFS 설정 확인
- name: NFS 설정 검증
  hosts: masters
  become: true
  
  tasks:
    - name: NFS exports 확인
      command: showmount -e localhost
      register: nfs_exports
      changed_when: false

    - name: NFS exports 출력
      debug:
        var: nfs_exports.stdout_lines

    - name: NFS 서비스 상태 확인
      command: systemctl status nfs-server
      register: nfs_status
      changed_when: false

    - name: NFS 서비스 상태 출력
      debug:
        msg: "NFS 서버가 활성화되어 실행 중입니다."
      when: "'active (exited)' in nfs_status.stdout or 'active (running)' in nfs_status.stdout"

    - name: 설정 완료 메시지
      debug:
        msg:
          - "=============================="
          - "NFS 서버 설정이 완료되었습니다!"
          - "=============================="
          - "Dynamic Provisioning을 위한 준비가 완료되었습니다."