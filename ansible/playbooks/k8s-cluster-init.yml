---
# 마스터 노드 초기화
- name: Kubernetes 마스터 노드 초기화
  hosts: masters
  become: true
  vars:
    k8s_version: "1.27.2" 
    pod_network_cidr: "10.244.0.0/16"

  tasks:
    - name: 기존 클러스터 및 프로세스 정리
      shell: |
        echo "=== 기존 API 서버 프로세스 확인 및 종료 ==="
        # 6443 포트 사용 프로세스 강제 종료
        if ss -tlnp | grep :6443; then
          echo "API 서버가 실행 중입니다. 종료 중..."
          pkill -9 -f kube-apiserver || true
          pkill -9 -f etcd || true
          systemctl stop kubelet || true
          sleep 3
        fi
        
        # kubeadm reset
        if command -v kubeadm &>/dev/null; then
          echo "kubeadm reset 실행 중..."
          kubeadm reset -f --cri-socket=/run/containerd/containerd.sock
        fi
        
        # 설정 파일 완전 삭제
        rm -rf /etc/kubernetes /var/lib/etcd /root/.kube
        
        # iptables 재정리
        iptables -F && iptables -t nat -F && iptables -X
        iptables -t mangle -F
        
        # CNI 정리
        rm -rf /etc/cni/net.d/*
        rm -rf /var/lib/cni/
        
        # containerd 재시작
        systemctl restart containerd
        systemctl restart kubelet
        
        sleep 5
      ignore_errors: yes
      changed_when: false

    - name: 포트 6443 사용 확인
      shell: ss -tlnp | grep :6443 || echo "Port 6443 is free"
      register: port_check
      changed_when: false

    - name: 포트 상태 출력
      debug:
        msg: "{{ port_check.stdout }}"

    - name: 클러스터 초기화
      shell: |
        kubeadm init \
          --pod-network-cidr={{ pod_network_cidr }} \
          --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      register: kubeadm_init

    - name: kubectl 설정
      block:
        - name: kubectl 설정 디렉토리 생성
          file:
            path: /root/.kube
            state: directory
            mode: "0755"
        
        - name: admin.conf 복사
          copy:
            src: /etc/kubernetes/admin.conf
            dest: /root/.kube/config
            remote_src: true
            mode: "0644"

    - name: Flannel CNI 설치
      shell: |
        kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /root/.kube/config
      retries: 3
      delay: 10

    - name: 마스터 노드 taint 제거 (선택사항)
      shell: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      environment:
        KUBECONFIG: /root/.kube/config
      ignore_errors: yes

    - name: 워커 조인 명령 생성
      shell: kubeadm token create --print-join-command
      register: join_command

    - name: 조인 명령 저장
      set_fact:
        join_cmd: "{{ join_command.stdout }}"
        cacheable: yes

# 워커 노드 조인
- name: 워커 노드 조인
  hosts: workers
  become: true
  tasks:
    # ✅ 워커 노드도 정리 추가
    - name: 기존 설정 정리
      shell: |
        if [ -f /etc/kubernetes/kubelet.conf ]; then
          kubeadm reset -f --cri-socket=/run/containerd/containerd.sock
          rm -rf /etc/kubernetes /var/lib/kubelet
          rm -rf /etc/cni/net.d/*
          iptables -F && iptables -t nat -F
          systemctl restart kubelet containerd
        fi
      ignore_errors: yes
      changed_when: false

    - name: 클러스터 조인
      shell: "{{ hostvars[groups['masters'][0]]['join_cmd'] }}"

# 클러스터 검증
- name: 클러스터 상태 확인
  hosts: masters
  become: true
  tasks:
    - name: 노드 Ready 대기
      shell: kubectl get nodes --no-headers | grep -c " Ready"
      register: ready_nodes
      until: ready_nodes.stdout | int >= groups['all'] | length
      retries: 30
      delay: 10
      environment:
        KUBECONFIG: /root/.kube/config

    - name: 클러스터 상태 출력
      shell: |
        echo "=== 노드 상태 ==="
        kubectl get nodes -o wide
        echo -e "\n=== Pod Network ==="
        kubectl get pods -n kube-flannel
        echo -e "\n=== 시스템 Pods ==="
        kubectl get pods -n kube-system | head -20
      register: cluster_status
      environment:
        KUBECONFIG: /root/.kube/config

    - name: 상태 표시
      debug:
        var: cluster_status.stdout_lines

    - name: 선택적 컴포넌트 설치
      block:
        - name: Dashboard 설치
          shell: |
            kubectl create -f https://raw.githubusercontent.com/k8s-1pro/install/main/ground/k8s-1.27/dashboard-2.7.0/dashboard.yaml
          ignore_errors: yes
        
        - name: Metrics Server 설치  
          shell: |
            kubectl create -f https://raw.githubusercontent.com/k8s-1pro/install/main/ground/k8s-1.27/metrics-server-0.6.3/metrics-server.yaml
          ignore_errors: yes
      environment:
        KUBECONFIG: /root/.kube/config
      tags: [addons]

    - name: 설치 완료 메시지
      debug:
        msg:
          - "Kubernetes {{ k8s_version }} 클러스터 구축 완료!"
          - "CNI: Flannel ({{ pod_network_cidr }})"
          - "사용법: export KUBECONFIG=/root/.kube/config"
          - ""
          - "대시보드 접속:"
          - "kubectl proxy 또는 NodePort 설정"
          - ""
          - "클러스터 확인:"
          - "kubectl get nodes"
          - "kubectl get pods -A"